<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Byte-identical to the marketing site's icons and declared the same way it
      declares them (central_server/templates/marketing_landing.html), so a
      visitor crossing from mobaide.com sees the same tab icon here.
    -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Same URL as theme.css's @font-face url() — keep the two byte-identical
      (a differing preload key downloads the font twice). No ?v= for the same
      reason the portal's font preload carries none.
    -->
    <link
      rel="preload"
      href="/fonts/DepartureMono-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!--
      Installability is not the point: `display: standalone` is what makes
      `matchMedia('(display-mode: standalone)')` answer true, which is the signal
      the Tier-1 keyboard widening reads (src/keyboard/reservedKeys.ts). The
      manifest carries one 180px raster icon, which at least avoids the known
      Chromium failure on an SVG-only `sizes: "any"` set. Whether it clears
      Chrome's install bar is unverified — its published criteria ask for
      192 + 512 — and closing that properly is CLA-252.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!--
      Caddy's SPA fallback answers every path with this one file, so a crawler
      sees `/login`, `/register` and every signed-in route as the same page as
      `/`. Declaring `/` stops Search Console reporting them as "Duplicate
      without user-selected canonical". Absolute and hard-coded: the SPA only
      ever deploys to app.mobaide.com (deploy_web.py), and a dev server
      pointing here is never crawled.
    -->
    <link rel="canonical" href="https://app.mobaide.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Mobaide</title>
    <script>
      // Pre-paint theme boot: stamp data-theme from the persisted preference
      // before first paint so the page never flashes the wrong theme.
      // The persisted contract (key name, zustand persist envelope shape,
      // value set) is owned by src/stores/themeStore.ts — change both
      // together.
      (function () {
        var pref = 'system';
        try {
          var raw = localStorage.getItem('mobaide-theme');
          if (raw) pref = JSON.parse(raw).state.preference;
        } catch (e) {
          pref = 'system';
        }
        if (pref !== 'light' && pref !== 'dark') {
          pref = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.dataset.theme = pref;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
