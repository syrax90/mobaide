# Only these two keys are managed by the profile switcher.
# Your real android/local.properties keeps sdk.dir and any other keys untouched.
#
# CENTRAL_SERVER_URL — base URL the Android app uses to reach the central server.
#   Local Caddy stack: https://test.claude-mobile.com
#   Production:        https://mobaide.com
#
# GOOGLE_WEB_CLIENT_ID — OAuth 2.0 Web client ID from Google Cloud Console.
#   See README.md section "Configuring Google Sign-In".
CENTRAL_SERVER_URL=https://change-me.example.com
GOOGLE_WEB_CLIENT_ID=
