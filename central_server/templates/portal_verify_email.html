{% extends "portal_base.html" %}
{% block title %}Verify your email — Mobaide{% endblock %}
{% block content %}
<div class="card login-card">
    <h2>Check your inbox</h2>
    <p>We sent a 6-digit code to <strong>{{ email }}</strong>. Enter it below to finish setting up your account.</p>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/portal/verify-email">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="email" value="{{ email }}">
        <label for="code">Verification code</label>
        <input type="text" id="code" name="code" class="otp-input" required autofocus inputmode="numeric" pattern="[0-9]{6}" maxlength="6">
        <button type="submit" class="btn">Verify</button>
    </form>
</div>
{% endblock %}
