{# Dismissal, the mode/method wiring and the social re-auth buttons are all in
   static/site/portal.js: this fragment is swapped into #modal-root by htmx, and
   `/portal/*` runs under a script-src with no 'unsafe-inline', so neither an
   inline <script> nor an onclick= attribute would execute here. portal.js
   listens for [data-modal-close] and for a click landing on .modal-overlay
   itself, and initialises this form from htmx.onLoad.

   `has_password` / `has_google` / `has_apple` mean *offerable* (linked AND
   configured), so `methods` lists the paths this account can actually
   complete. Exactly one means no chooser and a hidden `method`; the first
   entry is the pre-selected one. #}
{% set methods = [] %}
{% if has_password %}{% set _ = methods.append('password') %}{% endif %}
{% if has_google %}{% set _ = methods.append('google') %}{% endif %}
{% if has_apple %}{% set _ = methods.append('apple') %}{% endif %}
<div class="modal-overlay">
    <div class="modal-card">
        <h2>Delete your account</h2>
        {% if is_seed_admin %}
        <div class="alert alert-error">
            The seed admin account cannot be self-deleted.
        </div>
        <div class="btn-row btn-row-end">
            <button type="button" class="btn btn-ghost" data-modal-close>
                Close
            </button>
        </div>
        {% else %}
        {% if error %}
        <div class="alert alert-error">{{ error }}</div>
        {% endif %}
        <p>
            You're about to delete <strong>{{ user.email }}</strong>.
            Choose how the deletion is processed, re-verify your identity, and
            confirm by typing your email.
        </p>
        {% if agents %}
        <p>
            This will revoke
            <strong>{{ agents | length }}</strong>
            agent{{ '' if agents | length == 1 else 's' }}:
            <em>{% for a in agents %}{{ a.name }}{% if not loop.last %}, {% endif %}{% endfor %}</em>
            and tear down every live session immediately.
        </p>
        {% endif %}

        <form id="delete-account-form"
              data-delete-account-form
              data-grace-days="{{ grace_days }}"
              hx-post="/portal/account/delete"
              hx-target="#modal-root"
              hx-swap="innerHTML">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <input type="hidden" name="credential" value="">
            {% if methods | length == 1 %}
            <input type="hidden" name="method" value="{{ methods[0] }}">
            {% endif %}

            <fieldset class="choice-set">
                <legend>How should we process this?</legend>
                <label class="choice-option">
                    <input type="radio" name="mode" value="scheduled" checked>
                    <strong>Schedule for {{ grace_days }} days (recommended)</strong>
                    <span class="choice-note">Sign in any time before then to cancel. Your data stays put during the grace window.</span>
                </label>
                <label class="choice-option danger">
                    <input type="radio" name="mode" value="immediate">
                    <strong>Delete immediately</strong>
                    <span class="choice-note">No grace window, no recovery — all agents, pairings, and templates are purged now.</span>
                </label>
            </fieldset>

            {% if methods | length > 1 %}
            <fieldset class="choice-set">
                <legend>Re-verify with</legend>
                {% if has_password %}
                <label class="choice-option">
                    <input type="radio" name="method" value="password"
                           {% if methods[0] == 'password' %}checked{% endif %}>
                    <strong>Your password</strong>
                </label>
                {% endif %}
                {% if has_google %}
                <label class="choice-option">
                    <input type="radio" name="method" value="google"
                           {% if methods[0] == 'google' %}checked{% endif %}>
                    <strong>Google sign-in</strong>
                </label>
                {% endif %}
                {% if has_apple %}
                <label class="choice-option">
                    <input type="radio" name="method" value="apple"
                           {% if methods[0] == 'apple' %}checked{% endif %}>
                    <strong>Sign in with Apple</strong>
                </label>
                {% endif %}
            </fieldset>
            {% endif %}

            {% if has_password %}
            <div id="reauth-password-panel">
                {% with input_id="reauth-password",
                        input_name="password",
                        label_text="Current password",
                        autocomplete="current-password" %}
                {% include "_portal_password_input.html" %}
                {% endwith %}
            </div>
            {% endif %}

            <label for="confirm-email" class="label-prose">
                Type <code>{{ user.email }}</code> to confirm:
            </label>
            <input type="text"
                   id="confirm-email"
                   name="confirm_email"
                   data-expected="{{ user.email }}"
                   autocomplete="off">

            {% if has_google %}
            <div id="reauth-google-panel" class="reauth-panel">
                <p id="confirm-delete-google-hint" class="delete-mode-hint"></p>
                {# The wrapper carries aria-disabled because GIS renders its
                   button inside a cross-origin iframe that we cannot disable;
                   portal.js drops the credential on the floor until the typed
                   email matches. The Apple button below is ours, so it takes
                   a real `disabled` instead. #}
                <div id="confirm-delete-google-wrapper"
                     class="google-verify-wrapper"
                     aria-disabled="true">
                    <div id="confirm-delete-google-btn"
                         data-gis-client-id="{{ google_client_id or '' }}"
                         data-gis-nonce="{{ signin_nonce or '' }}"></div>
                </div>
            </div>
            {% endif %}

            {% if has_apple %}
            <div id="reauth-apple-panel" class="reauth-panel">
                <p id="confirm-delete-apple-hint" class="delete-mode-hint"></p>
                <button type="button"
                        id="confirm-delete-apple-btn"
                        class="apple-btn"
                        disabled
                        data-apple-client-id="{{ apple_web_client_id or '' }}"
                        data-apple-nonce="{{ signin_nonce or '' }}">
                    {% include "_portal_apple_mark.html" %}
                    <span>Continue with Apple</span>
                </button>
            </div>
            {% endif %}

            <div class="btn-row btn-row-end">
                <button type="button" class="btn btn-ghost" data-modal-close>
                    Cancel
                </button>
                {% if has_password %}
                <button type="submit"
                        id="confirm-delete-btn"
                        class="btn btn-danger"
                        data-label-scheduled="Schedule deletion"
                        data-label-immediate="Delete immediately"
                        disabled>
                    Schedule deletion
                </button>
                {% endif %}
            </div>
        </form>
        {% endif %}
    </div>
</div>
