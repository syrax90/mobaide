{% extends "portal_base.html" %}
{% block title %}Choose a new password — Mobaide{% endblock %}
{% block content %}
<div class="card login-card">
    <h2>Choose a new password</h2>
    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}
    <p>Enter the 6-digit code from your email along with your new password.</p>
    <form method="post" action="/portal/reset-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required value="{{ email }}">
        <label for="code">Reset code</label>
        <input type="text" id="code" name="code" required inputmode="numeric" pattern="[0-9]{6}" maxlength="6">
        <label for="new_password">New password</label>
        <input type="password" id="new_password" name="new_password" required minlength="8">
        <button type="submit" class="btn btn-primary">Reset password</button>
    </form>
</div>
{% endblock %}
