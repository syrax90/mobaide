<div class="qr-result">
    <img src="data:image/png;base64,{{ qr_base64 }}" alt="Pairing QR Code" class="qr-image">
    <div class="qr-details">
        <p><strong>Manual entry token:</strong></p>
        <pre class="token-display">{{ raw_token }}</pre>
        <p class="text-muted">Expires: {{ expires_at }}</p>
        <p class="text-muted">Single use only. Scan with Claude Mobile app or enter token manually.</p>
    </div>
</div>
