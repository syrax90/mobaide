{% for p in pairings %}
<tr id="pairing-{{ p.pairing_id }}">
    <td><code>{{ p.mobile_device_id }}</code></td>
    <td>{{ p.device_name or "—" }}</td>
    <td>{{ p.created_at }}</td>
    <td>
        <button class="btn btn-sm btn-danger"
                hx-delete="/dashboard/pairings/{{ p.pairing_id }}"
                hx-target="#pairing-{{ p.pairing_id }}"
                hx-swap="outerHTML"
                hx-confirm="Revoke pairing for this device?">
            Revoke
        </button>
    </td>
</tr>
{% endfor %}
