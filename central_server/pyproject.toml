[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "central-server"
version = "0.2.15"
description = "Central relay server for Mobaide — WebSocket relay with user-owned agent management"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    # >=0.49: first release with the "websockets-sansio" ws implementation
    # key that __main__.py pins; an older cached uvicorn dies at startup.
    "uvicorn[standard]>=0.49",
    "PyJWT",
    "aiosqlite",
    "structlog>=24.1",
    "asgi-correlation-id>=4.3",
    "orjson",
    "python-dotenv",
    "jinja2",
    "python-multipart",
    "argon2-cffi",
    "alembic",
    "google-auth",
    "requests",
    "aiosmtplib>=3.0",
    "cryptography>=43.0",
    "markdown>=3.6",
    # 4.0 changed `key` semantics to the .p8 file *content* (3.x took a path)
    "aioapns>=4.0",
]

[project.scripts]
claude-central = "central_server.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "httpx",
    "httpx-ws",
    "pytest-xprocess>=1.0.0",
    "psutil>=5.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
