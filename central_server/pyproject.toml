[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "central-server"
version = "0.1.13"
description = "Central relay server for Mobaide — WebSocket relay with user-owned agent management"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "PyJWT",
    "aiosqlite",
    "structlog>=24.1",
    "asgi-correlation-id>=4.3",
    "orjson",
    "python-dotenv",
    "jinja2",
    "python-multipart",
    "argon2-cffi",
    "alembic",
    "google-auth",
    "requests",
    "aiosmtplib>=3.0",
    "cryptography>=43.0",
    "markdown>=3.6",
]

[project.scripts]
claude-central = "central_server.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "httpx",
    "httpx-ws",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
