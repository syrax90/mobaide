[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-mobile-server"
version = "0.1.0"
description = "Claude Mobile server — cross-platform PTY session manager"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pywinpty; sys_platform == 'win32'",
    "PyJWT",
    "gql",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["claude_mobile"]
