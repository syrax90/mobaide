services:
  claude-agent:
    build:
      context: ./claude_agent
      dockerfile: Dockerfile
    container_name: claude-mobile-agent
    restart: unless-stopped
    env_file:
      - ./claude_agent/.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - USER_STORE_PATH=/app/data/users.json
      - PROJECTS_STORE_PATH=/app/data/projects.json
      - AGENT_STATE_DIR=/app/data/state
    volumes:
      - agent-data:/app/data
    # Ports are NOT published — all external access goes through cloudflared.
    # Uncomment for local debugging without the tunnel:
    # ports:
    #   - "8000:8000"
    networks:
      - tunnel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  central-server:
    build:
      context: ./central_server
      dockerfile: Dockerfile
    container_name: claude-mobile-central-server
    restart: unless-stopped
    env_file:
      - ./central_server/.env
    environment:
      - HOST=0.0.0.0
      - PORT=9000
      - DB_PATH=/app/data/central_server.db
    volumes:
      - central-server-data:/app/data
    ports:
      - "9000:9000"
    networks:
      - tunnel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: claude-mobile-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-}
    networks:
      - tunnel-net
    depends_on:
      claude-agent:
        condition: service_healthy

  # Mailpit — dev-only SMTP catcher. Only starts with `docker compose --profile dev up`.
  # Web UI at http://localhost:8025; SMTP on localhost:1025 and mailpit:1025
  # (inside the tunnel-net network). Bound to loopback so untrusted networks
  # (café Wi-Fi, conferences) can't read captured OTPs off an exposed 0.0.0.0.
  mailpit:
    image: axllent/mailpit:v1.22
    container_name: claude-mobile-mailpit
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      # Allow plaintext AUTH — Mailpit does not do TLS in dev.
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
      - MP_MAX_MESSAGES=500
    ports:
      - "127.0.0.1:1025:1025"  # SMTP — loopback only
      - "127.0.0.1:8025:8025"  # Web UI + REST API — loopback only
    networks:
      - tunnel-net

volumes:
  agent-data:
  central-server-data:

networks:
  tunnel-net:
    driver: bridge
