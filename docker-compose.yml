services:
  central-server:
    build:
      context: ./central_server
      dockerfile: Dockerfile
    container_name: mobaide-central-server
    restart: unless-stopped
    env_file:
      - ./central_server/.env
    environment:
      - HOST=0.0.0.0
      - PORT=9000
      - DB_PATH=/app/data/central_server.db
    volumes:
      - central-server-data:/app/data
    ports:
      - "9000:9000"
    networks:
      - tunnel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Mailpit — dev-only SMTP catcher. Only starts with `docker compose --profile dev up`.
  # Web UI at http://localhost:8025; SMTP on localhost:1025 and mailpit:1025
  # (inside the tunnel-net network). Bound to loopback so untrusted networks
  # (café Wi-Fi, conferences) can't read captured OTPs off an exposed 0.0.0.0.
  mailpit:
    image: axllent/mailpit:v1.22
    container_name: mobaide-mailpit
    restart: unless-stopped
    profiles: ["dev"]
    environment:
      # Allow plaintext AUTH — Mailpit does not do TLS in dev.
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
      - MP_MAX_MESSAGES=500
    ports:
      - "127.0.0.1:1025:1025"  # SMTP — loopback only
      - "127.0.0.1:8025:8025"  # Web UI + REST API — loopback only
    networks:
      - tunnel-net

volumes:
  central-server-data:

networks:
  tunnel-net:
    driver: bridge
