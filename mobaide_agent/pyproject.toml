[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mobaide-agent"
version = "0.3.37"
description = "Mobaide agent — cross-platform PTY session manager with WebSocket API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pywinpty; sys_platform == 'win32'",
    "PyJWT",
    "gql",
    "httpx",
    "pydantic-settings>=2.5",
    "bcrypt",
    "structlog>=24.1",
    "asgi-correlation-id>=4.3",
    "orjson",
    "websockets>=13.0",
    "certifi",
    # The agent installs from binary wheels only. cryptography has no wheel
    # for Intel macOS after 48.0.1 and none for Windows on ARM64 after 46.0.3,
    # so those two platforms are capped there. The ">=49.0" on the first line
    # keeps every other platform on the newest version. The capped versions
    # have public advisories in parts the agent does not use: keep the agent
    # to Ed25519 signature checks from this package while the caps exist.
    # When a newer cryptography has those wheels again, go back to one plain
    # requirement.
    "cryptography>=49.0; (sys_platform != 'darwin' or platform_machine != 'x86_64') and (sys_platform != 'win32' or platform_machine != 'ARM64')",
    "cryptography>=43.0,<=48.0.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=46.0.0,<=46.0.3; sys_platform == 'win32' and platform_machine == 'ARM64'",
    "segno>=1.6",
]

[project.scripts]
mobaide-agent = "mobaide.__main__:main"
mobaide-agent-launcher = "mobaide.launcher.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "httpx-ws",
    "pytest-xprocess>=1.0.0",
    "psutil>=5.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["mobaide"]

[tool.hatch.build.targets.wheel.force-include]
"mobaide/agent/env.template" = "mobaide/agent/env.template"
