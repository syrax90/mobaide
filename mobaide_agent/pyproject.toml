[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mobaide-agent"
version = "0.3.3"
description = "Mobaide agent — cross-platform PTY session manager with WebSocket API"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pywinpty; sys_platform == 'win32'",
    "PyJWT",
    "gql",
    "httpx",
    "pydantic-settings>=2.5",
    "bcrypt",
    "structlog>=24.1",
    "asgi-correlation-id>=4.3",
    "orjson",
    "websockets>=13.0",
    "certifi",
    "cryptography>=43.0",
    "segno>=1.6",
]

[project.scripts]
mobaide-agent = "mobaide.__main__:main"
mobaide-agent-launcher = "mobaide.launcher.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "httpx-ws",
    "pytest-xprocess>=1.0.0",
    "psutil>=5.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["mobaide"]

[tool.hatch.build.targets.wheel.force-include]
"mobaide/agent/env.template" = "mobaide/agent/env.template"
