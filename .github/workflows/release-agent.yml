name: Release agent

on:
  push:
    tags:
      - "agent-v*"

concurrency:
  group: release-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Public sibling repo that hosts agent release artifacts (the source
      # repo is private, so anonymous installs cannot reach release URLs
      # there). Configured as a repo Variable, not a secret. Bootstrap
      # steps live in docs/versioning-and-updates.md.
      RELEASES_REPO: ${{ vars.RELEASES_REPO }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install signing tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#agent-v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build wheel + sdist
        working-directory: mobaide_agent
        run: uv build --wheel --sdist

      - name: Create source tarball
        working-directory: mobaide_agent
        run: tar czf "mobaide-agent-${{ steps.version.outputs.version }}.tar.gz" --exclude=__pycache__ --exclude='*.pyc' mobaide

      - name: Compute checksums
        id: checksum
        working-directory: mobaide_agent
        run: |
          tarball="mobaide-agent-${{ steps.version.outputs.version }}.tar.gz"
          wheel=$(ls dist/*.whl | head -n 1)
          tarball_sha=$(sha256sum "$tarball" | awk '{print $1}')
          wheel_sha=$(sha256sum "$wheel" | awk '{print $1}')
          echo "tarball_path=mobaide_agent/${tarball}" >> "$GITHUB_OUTPUT"
          echo "wheel_path=mobaide_agent/${wheel}" >> "$GITHUB_OUTPUT"
          echo "tarball_sha=${tarball_sha}" >> "$GITHUB_OUTPUT"
          echo "wheel_sha=${wheel_sha}" >> "$GITHUB_OUTPUT"

      - name: Build signed manifest
        id: manifest
        if: ${{ env.AGENT_MANIFEST_PRIVATE_KEY != '' }}
        env:
          AGENT_MANIFEST_PRIVATE_KEY: ${{ secrets.AGENT_MANIFEST_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL_SHA: ${{ steps.checksum.outputs.tarball_sha }}
          WHEEL_SHA: ${{ steps.checksum.outputs.wheel_sha }}
        run: |
          python <<'PY'
          import base64, json, os
          from datetime import datetime, timezone
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          version = os.environ["VERSION"]
          releases_repo = os.environ["RELEASES_REPO"]
          if not releases_repo:
              raise SystemExit(
                  "RELEASES_REPO is not configured (repo Variable). "
                  "See docs/versioning-and-updates.md → Releases repo bootstrap."
              )
          base = f"https://github.com/{releases_repo}/releases/download/agent-v{version}"
          body = {
              "version": version,
              "tarball_url": f"{base}/mobaide-agent-{version}.tar.gz",
              "tarball_sha256": os.environ["TARBALL_SHA"],
              "wheel_url": f"{base}/mobaide_agent-{version}-py3-none-any.whl",
              "wheel_sha256": os.environ["WHEEL_SHA"],
              "released_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "min_central_server_version": "0.1.0",
          }
          canonical = json.dumps(body, sort_keys=True, separators=(",", ":")).encode()
          private_key_b64 = os.environ["AGENT_MANIFEST_PRIVATE_KEY"]
          private_key_bytes = base64.b64decode(private_key_b64)
          private_key = Ed25519PrivateKey.from_private_bytes(private_key_bytes)
          signature = private_key.sign(canonical)
          record = {"body": body, "signature_b64": base64.b64encode(signature).decode()}
          with open("manifest.json", "w") as fh:
              json.dump(record, fh, indent=2, sort_keys=True)
          PY

      - name: Create GitHub Release in public releases repo
        if: ${{ env.AGENT_MANIFEST_PRIVATE_KEY != '' }}
        env:
          # Hoisted into per-step env so the if-guard above can reference
          # it via `env.X` (the only context name allowed by GitHub Actions
          # for step-level `if:` expressions; `secrets.X` does not parse
          # there). Matches the same pattern used by release-android.yml's
          # PLAY_SERVICE_ACCOUNT_JSON guard.
          AGENT_MANIFEST_PRIVATE_KEY: ${{ secrets.AGENT_MANIFEST_PRIVATE_KEY }}
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.checksum.outputs.tarball_path }}
            ${{ steps.checksum.outputs.wheel_path }}
            manifest.json

      - name: Verify release artifact URLs are anonymously reachable
        if: ${{ env.AGENT_MANIFEST_PRIVATE_KEY != '' }}
        env:
          AGENT_MANIFEST_PRIVATE_KEY: ${{ secrets.AGENT_MANIFEST_PRIVATE_KEY }}
        run: |
          # Anonymous reachability gate: every URL in the signed manifest
          # must be fetchable without auth before we publish the manifest
          # to central_server. If RELEASES_REPO is wrong/private, an
          # asset name is misspelt, or upload didn't actually land, this
          # step fails BEFORE central_server sees the manifest. Notes:
          #   * `-r 0-0` issues a 1-byte ranged GET, not HEAD. GitHub's
          #     CDN-signed redirect target on objects.githubusercontent.com
          #     intermittently rejects HEAD with 403/405 even when GET
          #     works. The install script uses urllib's GET, so a ranged
          #     GET also exercises the path the install will take.
          #     `-o /dev/null` discards the byte; expected status is
          #     206 Partial Content, which `--fail` accepts.
          #   * `--retry-all-errors` is required to retry on the 4xx
          #     that softprops/action-gh-release@v2's eventual-
          #     consistency lag produces (issues #194, #511): default
          #     `--retry` covers timeouts/5xx/connection-refused but
          #     NOT 4xx, so without `--retry-all-errors` the retry
          #     budget would never absorb the propagation 404 it was
          #     added for.
          tarball_url=$(python -c "import json; print(json.load(open('manifest.json'))['body']['tarball_url'])")
          wheel_url=$(python -c "import json; print(json.load(open('manifest.json'))['body']['wheel_url'])")
          for url in "$tarball_url" "$wheel_url"; do
            echo "GET (range 0-0) $url"
            if ! curl -fsSL --max-time 30 \
                  --retry 5 --retry-delay 10 --retry-all-errors \
                  -r 0-0 -o /dev/null "$url"; then
              echo "::error::$url is not anonymously reachable — refusing to publish manifest."
              exit 1
            fi
          done

      - name: Publish manifest to central_server (with retry)
        if: ${{ env.CENTRAL_SERVER_RELEASE_TOKEN != '' && env.CENTRAL_SERVER_URL != '' }}
        env:
          CENTRAL_SERVER_RELEASE_TOKEN: ${{ secrets.CENTRAL_SERVER_RELEASE_TOKEN }}
          CENTRAL_SERVER_URL: ${{ secrets.CENTRAL_SERVER_URL }}
        run: |
          curl -fsS \
            --retry 5 \
            --retry-delay 10 \
            --retry-connrefused \
            --max-time 60 \
            -X POST \
            -H "X-Release-Token: ${CENTRAL_SERVER_RELEASE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @manifest.json \
            "${CENTRAL_SERVER_URL%/}/api/internal/agent_manifest"

      - name: Verify manifest is published
        if: ${{ env.CENTRAL_SERVER_RELEASE_TOKEN != '' && env.CENTRAL_SERVER_URL != '' }}
        env:
          CENTRAL_SERVER_URL: ${{ secrets.CENTRAL_SERVER_URL }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          response=$(curl -fsS --retry 3 --retry-delay 5 \
            "${CENTRAL_SERVER_URL%/}/api/v1/agent/manifest.json")
          published=$(printf '%s' "$response" | python -c "import json,sys; print(json.load(sys.stdin)['body']['version'])")
          if [ "$published" != "$EXPECTED_VERSION" ]; then
            echo "::error::Published manifest version (${published}) does not match released version (${EXPECTED_VERSION})."
            exit 1
          fi
          echo "Verified manifest version=${published}"
