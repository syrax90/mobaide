name: Release agent

on:
  push:
    tags:
      - "agent-v*"

concurrency:
  group: release-agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install signing tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#agent-v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Build wheel + sdist
        working-directory: mobaide_agent
        run: uv build --wheel --sdist

      - name: Create source tarball
        working-directory: mobaide_agent
        run: tar czf "mobaide-agent-${{ steps.version.outputs.version }}.tar.gz" --exclude=__pycache__ --exclude='*.pyc' mobaide

      - name: Compute checksums
        id: checksum
        working-directory: mobaide_agent
        run: |
          tarball="mobaide-agent-${{ steps.version.outputs.version }}.tar.gz"
          wheel=$(ls dist/*.whl | head -n 1)
          tarball_sha=$(sha256sum "$tarball" | awk '{print $1}')
          wheel_sha=$(sha256sum "$wheel" | awk '{print $1}')
          echo "tarball_path=mobaide_agent/${tarball}" >> "$GITHUB_OUTPUT"
          echo "wheel_path=mobaide_agent/${wheel}" >> "$GITHUB_OUTPUT"
          echo "tarball_sha=${tarball_sha}" >> "$GITHUB_OUTPUT"
          echo "wheel_sha=${wheel_sha}" >> "$GITHUB_OUTPUT"

      - name: Build signed manifest
        id: manifest
        if: ${{ env.AGENT_MANIFEST_PRIVATE_KEY != '' }}
        env:
          AGENT_MANIFEST_PRIVATE_KEY: ${{ secrets.AGENT_MANIFEST_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL_SHA: ${{ steps.checksum.outputs.tarball_sha }}
          WHEEL_SHA: ${{ steps.checksum.outputs.wheel_sha }}
        run: |
          python <<'PY'
          import base64, json, os
          from datetime import datetime, timezone
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          version = os.environ["VERSION"]
          base = f"https://github.com/${{ github.repository }}/releases/download/agent-v{version}"
          body = {
              "version": version,
              "tarball_url": f"{base}/mobaide-agent-{version}.tar.gz",
              "tarball_sha256": os.environ["TARBALL_SHA"],
              "wheel_url": f"{base}/mobaide_agent-{version}-py3-none-any.whl",
              "wheel_sha256": os.environ["WHEEL_SHA"],
              "released_at": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "min_central_server_version": "0.1.0",
          }
          canonical = json.dumps(body, sort_keys=True, separators=(",", ":")).encode()
          private_key_b64 = os.environ["AGENT_MANIFEST_PRIVATE_KEY"]
          private_key_bytes = base64.b64decode(private_key_b64)
          private_key = Ed25519PrivateKey.from_private_bytes(private_key_bytes)
          signature = private_key.sign(canonical)
          record = {"body": body, "signature_b64": base64.b64encode(signature).decode()}
          with open("manifest.json", "w") as fh:
              json.dump(record, fh, indent=2, sort_keys=True)
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.checksum.outputs.tarball_path }}
            ${{ steps.checksum.outputs.wheel_path }}
            manifest.json

      - name: Publish manifest to central_server (with retry)
        if: ${{ env.CENTRAL_SERVER_RELEASE_TOKEN != '' && env.CENTRAL_SERVER_URL != '' }}
        env:
          CENTRAL_SERVER_RELEASE_TOKEN: ${{ secrets.CENTRAL_SERVER_RELEASE_TOKEN }}
          CENTRAL_SERVER_URL: ${{ secrets.CENTRAL_SERVER_URL }}
        run: |
          curl -fsS \
            --retry 5 \
            --retry-delay 10 \
            --retry-connrefused \
            --max-time 60 \
            -X POST \
            -H "X-Release-Token: ${CENTRAL_SERVER_RELEASE_TOKEN}" \
            -H "Content-Type: application/json" \
            --data @manifest.json \
            "${CENTRAL_SERVER_URL%/}/api/internal/agent_manifest"

      - name: Verify manifest is published
        if: ${{ env.CENTRAL_SERVER_RELEASE_TOKEN != '' && env.CENTRAL_SERVER_URL != '' }}
        env:
          CENTRAL_SERVER_URL: ${{ secrets.CENTRAL_SERVER_URL }}
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          response=$(curl -fsS --retry 3 --retry-delay 5 \
            "${CENTRAL_SERVER_URL%/}/api/v1/agent/manifest.json")
          published=$(printf '%s' "$response" | python -c "import json,sys; print(json.load(sys.stdin)['body']['version'])")
          if [ "$published" != "$EXPECTED_VERSION" ]; then
            echo "::error::Published manifest version (${published}) does not match released version (${EXPECTED_VERSION})."
            exit 1
          fi
          echo "Verified manifest version=${published}"

      - name: Sync install scripts and manifest to docs/get/ for GitHub Pages
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # The job is checked out at the tag commit (detached HEAD). Don't
          # push that tree to main — an off-main tag would otherwise be
          # promoted onto main with the elevated PAT. Instead, snapshot the
          # tag's deploy/install.* and the freshly-built manifest.json into
          # a buffer, switch to a fresh main checkout, copy the buffered
          # files there, and push from main. The manifest.json is what the
          # public install one-liner fetches from
          # https://get.mobaide.com/manifest.json (see docs/release-publishing.md).
          tag_install_sh=$(mktemp)
          tag_install_ps1=$(mktemp)
          cp deploy/install.sh "$tag_install_sh"
          cp deploy/install.ps1 "$tag_install_ps1"
          tag_manifest=""
          if [ -f manifest.json ]; then
            tag_manifest=$(mktemp)
            cp manifest.json "$tag_manifest"
          fi

          git fetch origin main
          git checkout -B sync-install-scripts origin/main
          mkdir -p docs/get
          cp "$tag_install_sh" docs/get/install.sh
          cp "$tag_install_ps1" docs/get/install.ps1
          if [ -n "$tag_manifest" ]; then
            cp "$tag_manifest" docs/get/manifest.json
          fi
          rm -f "$tag_install_sh" "$tag_install_ps1" ${tag_manifest:+"$tag_manifest"}

          paths=(docs/get/install.sh docs/get/install.ps1)
          [ -f docs/get/manifest.json ] && paths+=(docs/get/manifest.json)
          if git diff --quiet -- "${paths[@]}"; then
            echo "Pages-served install scripts and manifest already match — nothing to sync."
            exit 0
          fi
          git add "${paths[@]}"
          git commit -m "chore(release): sync install scripts and manifest for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
