name: Publish install scripts to gh-pages

on:
  push:
    branches: [main]
    paths:
      - "deploy/install.sh"
      - "deploy/install.ps1"
      - "deploy/windows_launcher.py"
  workflow_dispatch:

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Sync install scripts from main into gh-pages root
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git fetch origin main --depth=1
          git show origin/main:deploy/install.sh          > install.sh
          git show origin/main:deploy/install.ps1         > install.ps1
          # windows_launcher.py is the stdlib-only Scheduled-Task supervisor
          # that install.ps1 downloads into <prefix>\svc\mobaide_launcher.py
          # at install time. Co-versioned with install.ps1 so an installer
          # change that depends on a new supervisor API ships them together.
          # The previous LocalSystem SCM-service design was replaced with a
          # per-user Scheduled Task; the supervisor wraps the release
          # launcher with log rotation and exit-75 respawn so the agent
          # process tree has a real %USERPROFILE% (mirrors Linux's
          # $SUDO_USER semantics).
          git show origin/main:deploy/windows_launcher.py > windows_launcher.py

          if git diff --quiet -- install.sh install.ps1 windows_launcher.py; then
            echo "gh-pages install scripts already match main — nothing to publish."
            exit 0
          fi

          git add install.sh install.ps1 windows_launcher.py
          git commit -m "publish: sync install scripts from main@${GITHUB_SHA::7}"
          git push origin gh-pages
