name: Publish install scripts to gh-pages

# Installers go live only after an agent release has finished and its signed
# manifest is verified on central_server, so get.mobaide.com never serves an
# installer ahead of the agent it installs. Files are taken from the released
# commit, not the current main tip, so installer changes merged after the
# release PR wait for the next release.
on:
  workflow_run:
    workflows: ["Release agent"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Restrict manual runs to main or an agent release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main|refs/tags/agent-v*) ;;
            *)
              echo "::error::Run this workflow from main or an agent-v* tag, not ${REF}."
              exit 1
              ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Sync install scripts from the released commit into gh-pages root
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git fetch origin "$SOURCE_SHA" --depth=1
          git show "$SOURCE_SHA":deploy/install.sh          > install.sh
          git show "$SOURCE_SHA":deploy/install.ps1         > install.ps1
          # windows_launcher.py is the stdlib-only Scheduled-Task supervisor
          # that install.ps1 downloads into <prefix>\svc\mobaide_launcher.py
          # at install time. Co-versioned with install.ps1 so an installer
          # change that depends on a new supervisor API ships them together.
          # The previous LocalSystem SCM-service design was replaced with a
          # per-user Scheduled Task; the supervisor wraps the release
          # launcher with log rotation and exit-75 respawn so the agent
          # process tree has a real %USERPROFILE% (mirrors Linux's
          # $SUDO_USER semantics).
          git show "$SOURCE_SHA":deploy/windows_launcher.py > windows_launcher.py

          if git diff --quiet -- install.sh install.ps1 windows_launcher.py; then
            echo "gh-pages install scripts already match ${SOURCE_SHA::7} — nothing to publish."
            exit 0
          fi

          git add install.sh install.ps1 windows_launcher.py
          git commit -m "publish: sync install scripts from ${SOURCE_SHA::7}"
          git push origin gh-pages
