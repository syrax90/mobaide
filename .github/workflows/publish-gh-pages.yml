name: Publish install scripts to gh-pages

on:
  push:
    branches: [main]
    paths:
      - "deploy/install.sh"
      - "deploy/install.ps1"
      - "deploy/windows_service.py"
  workflow_dispatch:

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Sync install scripts from main into gh-pages root
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git fetch origin main --depth=1
          git show origin/main:deploy/install.sh         > install.sh
          git show origin/main:deploy/install.ps1        > install.ps1
          # windows_service.py is the pywin32 ServiceFramework wrapper that
          # install.ps1 downloads into <prefix>\svc\mobaide_service.py at
          # install time. Co-versioned with install.ps1 so an installer
          # change that depends on the service module ships them together.
          # The pre-fix design copied this file out of the installed wheel,
          # which coupled installer changes to wheel re-tagging and broke
          # whenever an install.ps1 change shipped (via gh-pages) faster
          # than a new wheel tag.
          git show origin/main:deploy/windows_service.py > windows_service.py

          if git diff --quiet -- install.sh install.ps1 windows_service.py; then
            echo "gh-pages install scripts already match main — nothing to publish."
            exit 0
          fi

          git add install.sh install.ps1 windows_service.py
          git commit -m "publish: sync install scripts from main@${GITHUB_SHA::7}"
          git push origin gh-pages
