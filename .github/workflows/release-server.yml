name: Release central_server

on:
  push:
    tags:
      - "server-v*"

concurrency:
  group: release-server-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version from tag
        id: version
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#server-v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image_tag=ghcr.io/${{ github.repository }}-server:v${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        working-directory: central_server
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: central_server
          file: central_server/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-server:v${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}-server:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            central_server/dist/*.whl

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Record deploy approval
        env:
          IMAGE_TAG: ${{ needs.build-and-publish.outputs.image_tag }}
          VERSION: ${{ needs.build-and-publish.outputs.version }}
        run: |
          echo "Deploy of central_server ${VERSION} approved."
          echo "Image: ${IMAGE_TAG}"
          echo "Operator must roll out via deploy/prod/deploy-central.ps1 or"
          echo "by running: docker compose -f deploy/prod/docker-compose.prod.yml pull && up -d"
