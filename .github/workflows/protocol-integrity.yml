name: Protocol integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: protocol-integrity-${{ github.ref }}
  cancel-in-progress: true

# Without an explicit permissions block, the workflow inherits the repo
# default, which can leave actions/checkout's GITHUB_TOKEN without the
# contents:read scope it needs to embed a usable Basic-auth header into
# the cloned remote's URL — surfacing as
#   fatal: could not read Username for 'https://github.com': terminal prompts disabled
# on the very first fetch. Declaring contents:read explicitly is the
# documented mitigation and is also the least-privilege envelope this job
# needs (it diffs the PR's two SHAs and runs pytest; no writes).
permissions:
  contents: read
  pull-requests: read

jobs:
  protocol-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install both packages with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e 'mobaide_agent[dev]'
          python -m pip install -e 'central_server[dev]'

      - name: Run protocol integrity tests
        run: python -m pytest tests/test_protocol_integrity.py -v

      # The iOS client carries its own copy of the protocol constants in an
      # xcconfig (surfaced to Swift via Info.plist), and the web client in a TS
      # module. Extract all three by regex and compare, so a proto bump that
      # misses a client fails here — the check is version-agnostic and needs no
      # update on bumps. MIN_SERVER_PROTOCOL_VERSION stays a two-way check:
      # the web version gate is set membership against the server's advertised
      # list (`checkVersionGate`) and has no client-side floor of its own.
      - name: Client protocol constants must match Android
        run: |
          android_app=$(sed -n 's/.*buildConfigField("int", "APP_PROTOCOL_VERSION", "\([0-9]*\)").*/\1/p' android/app/build.gradle.kts)
          android_min=$(sed -n 's/.*buildConfigField("int", "MIN_SERVER_PROTOCOL_VERSION", "\([0-9]*\)").*/\1/p' android/app/build.gradle.kts)
          ios_app=$(sed -n 's/^APP_PROTOCOL_VERSION *= *\([0-9][0-9]*\) *$/\1/p' ios/Config/Protocol.xcconfig)
          ios_min=$(sed -n 's/^MIN_SERVER_PROTOCOL_VERSION *= *\([0-9][0-9]*\) *$/\1/p' ios/Config/Protocol.xcconfig)
          web_app=$(sed -n 's/^export const APP_PROTOCOL_VERSION = \([0-9][0-9]*\);$/\1/p' web/src/api/bootstrap.ts)
          if [ -z "$android_app" ] || [ -z "$ios_app" ] || [ "$android_app" != "$ios_app" ]; then
            echo "::error::APP_PROTOCOL_VERSION mismatch: android='${android_app}' ios='${ios_app}' — bump ios/Config/Protocol.xcconfig together with android/app/build.gradle.kts (see PROTOCOL.md 'How to bump')."
            exit 1
          fi
          if [ -z "$web_app" ] || [ "$android_app" != "$web_app" ]; then
            echo "::error::APP_PROTOCOL_VERSION mismatch: android='${android_app}' web='${web_app}' — bump web/src/api/bootstrap.ts together with android/app/build.gradle.kts (see PROTOCOL.md 'How to bump')."
            exit 1
          fi
          if [ -z "$android_min" ] || [ -z "$ios_min" ] || [ "$android_min" != "$ios_min" ]; then
            echo "::error::MIN_SERVER_PROTOCOL_VERSION mismatch: android='${android_min}' ios='${ios_min}' — bump ios/Config/Protocol.xcconfig together with android/app/build.gradle.kts (see PROTOCOL.md 'How to bump')."
            exit 1
          fi
          echo "Client protocol constants match (APP=${android_app} on android/ios/web, MIN_SERVER=${ios_min} on android/ios)."

      - name: Diff guard — both envelope.py files must move together
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- \
            'mobaide_agent/mobaide/relay/envelope.py' \
            'central_server/central_server/relay/envelope.py' | sort -u)
          agent_changed=$(printf '%s\n' "$changed" | grep -c '^mobaide_agent/mobaide/relay/envelope.py$' || true)
          central_changed=$(printf '%s\n' "$changed" | grep -c '^central_server/central_server/relay/envelope.py$' || true)
          if [ "$agent_changed" != "$central_changed" ]; then
            echo "::error::envelope.py files must be modified together — mobaide_agent and central_server copies are intentionally duplicated and any wire-shape change must touch both. agent_changed=${agent_changed} central_changed=${central_changed}."
            exit 1
          fi

  # The TypeScript arm of the golden fixtures (WEB-04). It reads
  # tests/protocol_fixtures/ off disk exactly as the iOS test target does, so a
  # fixture edit that breaks the web codec fails on the same PR that makes it —
  # and its coverage gate fails when a new fixture file lands unclassified.
  # Separate job because it needs Node rather than Python; the two are
  # independent and run in parallel.
  web-protocol-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run the TypeScript protocol suite
        working-directory: web
        run: npm run test:protocol
