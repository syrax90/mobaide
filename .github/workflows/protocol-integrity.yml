name: Protocol integrity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: protocol-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps for envelope import
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e claude_agent
          python -m pip install -e central_server

      - name: Validate envelope.py constants are mirrored
        run: python tests/test_protocol_integrity.py

      - name: Pytest protocol golden file
        run: python -m pytest tests/test_protocol_integrity.py -v

      - name: Diff guard — both envelope.py files must move together
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}" -- \
            'claude_agent/claude_mobile/relay/envelope.py' \
            'central_server/central_server/relay/envelope.py' | sort -u)
          agent_changed=$(printf '%s\n' "$changed" | grep -c '^claude_agent/claude_mobile/relay/envelope.py$' || true)
          central_changed=$(printf '%s\n' "$changed" | grep -c '^central_server/central_server/relay/envelope.py$' || true)
          if [ "$agent_changed" != "$central_changed" ]; then
            echo "::error::envelope.py files must be modified together — claude_agent and central_server copies are intentionally duplicated and any wire-shape change must touch both. agent_changed=${agent_changed} central_changed=${central_changed}."
            exit 1
          fi

      - name: Diff guard — install scripts must stay in sync between deploy/ and docs/get/
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          for name in install.sh install.ps1; do
            if ! cmp -s "deploy/${name}" "docs/get/${name}"; then
              echo "::error::deploy/${name} and docs/get/${name} drifted. The Pages-served copy must be byte-identical to the canonical source."
              diff "deploy/${name}" "docs/get/${name}" || true
              exit 1
            fi
          done
