name: Release please

on:
  push:
    branches: [main]

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # RELEASE_PLEASE_TOKEN must be a PAT with `workflow` scope so the tag
          # push it makes triggers the downstream release-agent / release-server
          # / release-android workflows. Falling back to GITHUB_TOKEN works for
          # PR creation but tag-pushes from GITHUB_TOKEN will NOT fire other
          # workflows — operators must push the tag manually in that case.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
