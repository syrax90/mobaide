name: Release please

on:
  push:
    branches: [main]

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          # GITHUB_TOKEN on purpose: the tags it pushes start no other
          # workflow, so a merge never ships a release by itself. The operator
          # ships each tag with deploy/prod/release_agent.py or
          # release_android.py, which hold the signing keys locally.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps MARKETING_VERSION (the `x-release-please-version`
      # line) but has no updater for a plain counter, so this step bumps the
      # iOS build number (CURRENT_PROJECT_VERSION) to main's value + 1 on the
      # release PR branch. It runs on every push and is idempotent: it does
      # nothing when the release PR carries no iOS release or already has the
      # right build number. When release-please regenerates the branch from
      # main, the commit is lost and this step adds it again.
      - name: Bump the iOS build number on the release PR
        env:
          BRANCH: release-please--branches--main
          VERSION_FILE: ios/Config/Version.xcconfig
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q bump && cd bump
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          if ! git fetch -q --depth=1 origin main "${BRANCH}"; then
            echo "No release PR branch; nothing to do."
            exit 0
          fi
          read_setting() { git show "$1:${VERSION_FILE}" | sed -nE "s/^$2 = ([0-9.]+).*/\1/p"; }
          main_version=$(read_setting origin/main MARKETING_VERSION)
          pr_version=$(read_setting "origin/${BRANCH}" MARKETING_VERSION)
          if [ "${main_version}" = "${pr_version}" ]; then
            echo "Release PR has no iOS release (${main_version}); nothing to do."
            exit 0
          fi
          main_build=$(read_setting origin/main CURRENT_PROJECT_VERSION)
          pr_build=$(read_setting "origin/${BRANCH}" CURRENT_PROJECT_VERSION)
          want_build=$((main_build + 1))
          if [ "${pr_build}" = "${want_build}" ]; then
            echo "iOS build number is already ${want_build}."
            exit 0
          fi
          git checkout -q -b release "origin/${BRANCH}"
          sed -i -E "s/^CURRENT_PROJECT_VERSION = [0-9]+/CURRENT_PROJECT_VERSION = ${want_build}/" "${VERSION_FILE}"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -am "chore(ios): bump build number to ${want_build}"
          git push -q origin "HEAD:${BRANCH}"
          echo "iOS ${pr_version} build number: ${main_build} -> ${want_build}"

      - name: Delete empty source-repo Releases (keep tags)
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PATHS_RELEASED: ${{ steps.release.outputs.paths_released }}
          ALL_OUTPUTS: ${{ toJSON(steps.release.outputs) }}
        # release-please-action v4 binds tag-push and GitHub Release creation
        # into a single API call (`manifest.createReleases()`), so the
        # `skip-github-release` flag — which we'd otherwise set — also
        # silently skips the tag push and the downstream release-*.yml
        # workflows never fire (see docs/versioning-and-updates.md and
        # release-please-action issue #1034). The supported workaround,
        # per the release-please docs ("this option should only be used if
        # you have existing infrastructure to tag these releases"), is to
        # let release-please tag-and-release normally and then delete the
        # source-repo Release here. `gh release delete` leaves the tag
        # untouched by default, so:
        #   * the tag stays
        #   * the downstream release-*.yml workflow has already started
        #     (tag push fired it the moment release-please created it)
        #   * the empty source-archive-bearing Release is gone
        # See docs/versioning-and-updates.md ("What happens after merge",
        # step 3) for why the empty Releases are unwanted (private source
        # repo + GitHub auto-attaches zipball / tarball to every Release
        # object + no consumer reads them).
        run: |
          echo "Paths released: ${PATHS_RELEASED}"
          echo "${PATHS_RELEASED}" | jq -r '.[]' | while read -r path; do
            tag=$(printf '%s' "${ALL_OUTPUTS}" | jq -r --arg p "${path}" '.[$p + "--tag_name"] // empty')
            if [ -z "${tag}" ]; then
              echo "::warning::No tag_name output for path ${path}; skipping cleanup."
              continue
            fi
            echo "Deleting source-repo Release for ${tag} (tag preserved)…"
            if ! gh release delete "${tag}" \
                  --repo "${{ github.repository }}" \
                  --yes; then
              echo "::warning::Failed to delete Release for ${tag}; an empty Release may linger on the source repo. Tag is unaffected."
            fi
          done
