name: Release protocol

on:
  push:
    tags:
      - "proto-v*"

concurrency:
  group: release-protocol-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps for envelope import
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e claude_agent
          python -m pip install -e central_server
          python -m pip install pytest

      - name: Validate envelope.py constants are mirrored
        run: python tests/test_protocol_integrity.py

      - name: Pytest protocol golden file
        run: python -m pytest tests/test_protocol_integrity.py -v

      - name: Resolve tag and previous proto tag
        id: tags
        run: |
          tag="${GITHUB_REF##*/}"
          version="${tag#proto-v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          prev=$(git tag --list 'proto-v*' --sort=-v:refname | grep -v "^${tag}$" | head -n 1 || true)
          echo "prev_tag=${prev}" >> "$GITHUB_OUTPUT"

      - name: Build release notes from PROTOCOL.md
        id: notes
        env:
          TAG: ${{ steps.tags.outputs.tag }}
          PREV_TAG: ${{ steps.tags.outputs.prev_tag }}
        run: |
          notes_file=$(mktemp)
          {
            echo "# ${TAG}"
            echo
            python <<'PY'
          import os, re, pathlib, sys
          tag = os.environ["TAG"]
          version = tag.removeprefix("proto-v")
          src = pathlib.Path("PROTOCOL.md").read_text(encoding="utf-8")
          # Heading shape in PROTOCOL.md is "## proto-vN" (current) or "## proto-vN (current)"
          pattern = re.compile(rf"^## {re.escape(tag)}\b.*?(?=^## |\Z)", re.M | re.S)
          match = pattern.search(src)
          if match:
              print(match.group(0).rstrip())
          else:
              print(f"_(No matching ## {tag} section found in PROTOCOL.md.)_")
          PY
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "## Wire-shape diff vs ${PREV_TAG}"
              echo
              echo '```diff'
              git diff "${PREV_TAG}..${TAG}" -- \
                'claude_agent/claude_mobile/relay/envelope.py' \
                'central_server/central_server/relay/envelope.py' \
                'tests/protocol_golden.json' || true
              echo '```'
            else
              echo "_(No previous proto-v tag — this is the initial protocol release.)_"
            fi
          } > "${notes_file}"
          echo "notes_file=${notes_file}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.tags.outputs.tag }}
          body_path: ${{ steps.notes.outputs.notes_file }}
