name: Release Android

on:
  push:
    tags:
      - "android-v*"

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

# contents:read is sufficient — the signed .aab is uploaded to the Play
# Console internal track via the google-play-action, not back to this
# repo. Same explicit-permissions mitigation as protocol-integrity.yml.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Determine in-app update priority from changelog
        id: priority
        run: |
          # The tag sits on release-please's "chore: release main" commit, whose
          # subject is never a feat/fix, so reading the tagged commit message
          # always yielded priority=1. Derive urgency from the CHANGELOG section
          # release-please generated for THIS exact version instead: any breaking
          # change -> 5, else any bug fix -> 3, else -> 1.
          ver="${GITHUB_REF_NAME#android-v}"
          section=$(awk -v ver="$ver" '
            index($0, "## [" ver "]") == 1 {found=1; print; next}
            found && /^## \[/ {exit}
            found {print}
          ' android/CHANGELOG.md)
          if [ -z "$section" ]; then
            echo "WARNING: no CHANGELOG section for ${ver}; defaulting priority=1"
            priority=1
          elif printf '%s\n' "$section" | grep -qiE '^### .*BREAKING'; then
            priority=5
          elif printf '%s\n' "$section" | grep -qE '^### Bug Fixes'; then
            priority=3
          else
            priority=1
          fi
          echo "priority=${priority}" >> "$GITHUB_OUTPUT"
          echo "Computed inAppUpdatePriority=${priority} for android-v${ver}"

      - name: Decode upload keystore (if provided)
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 provided; the workflow will produce an unsigned bundle."
          else
            echo "${KEYSTORE_BASE64}" | base64 -d > android/release.keystore
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release bundle
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          CENTRAL_SERVER_URL: ${{ secrets.CENTRAL_SERVER_URL }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload .aab as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload to Play Console (internal track)
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mobaide.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          inAppUpdatePriority: ${{ steps.priority.outputs.priority }}
