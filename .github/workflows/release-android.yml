name: Release Android

on:
  push:
    tags:
      - "android-v*"

concurrency:
  group: release-android-${{ github.ref }}
  cancel-in-progress: false

# contents:read is sufficient — the signed .aab is uploaded to the Play
# Console internal track via the google-play-action, not back to this
# repo. Same explicit-permissions mitigation as protocol-integrity.yml.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Determine in-app update priority from commit message
        id: priority
        run: |
          subject=$(git log -1 --pretty=%s)
          body=$(git log -1 --pretty=%b)
          # bash 5.x's [[ ]] pre-tokenizer mis-counts parens when ')' appears
          # inside [^)] within (...). Hold the patterns in shell variables so
          # bash sees only the variable reference at parse time.
          re_breaking='^[a-z]+(\([^)]+\))?!:'
          re_fix='^fix(\([^)]+\))?:'
          if [[ "$subject" =~ $re_breaking ]] || printf '%s\n' "$body" | grep -qE '^BREAKING[- ]CHANGE:'; then
            priority=5
          elif [[ "$subject" =~ $re_fix ]]; then
            priority=3
          else
            priority=1
          fi
          echo "priority=${priority}" >> "$GITHUB_OUTPUT"
          echo "Computed inAppUpdatePriority=${priority} from subject='${subject}'"

      - name: Decode upload keystore (if provided)
        id: decode_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No ANDROID_KEYSTORE_BASE64 provided; the workflow will produce an unsigned bundle."
          else
            echo "${KEYSTORE_BASE64}" | base64 -d > android/release.keystore
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release bundle
        env:
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          CENTRAL_SERVER_URL: ${{ secrets.CENTRAL_SERVER_URL }}
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload .aab as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle
          path: android/app/build/outputs/bundle/release/*.aab

      - name: Upload to Play Console (internal track)
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1.1.2
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mobaide.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          inAppUpdatePriority: ${{ steps.priority.outputs.priority }}
