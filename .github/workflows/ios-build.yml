name: iOS build

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "tests/protocol_fixtures/**"
      - ".github/workflows/ios-build.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "tests/protocol_fixtures/**"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

# Without an explicit permissions block, the workflow inherits the repo
# default, which can leave actions/checkout's GITHUB_TOKEN without the
# contents:read scope it needs to embed a usable Basic-auth header into
# the cloned remote's URL — surfacing as
#   fatal: could not read Username for 'https://github.com': terminal prompts disabled
# on the very first fetch. Declaring contents:read explicitly is the
# documented mitigation and is also the least-privilege envelope this job
# needs (it builds and runs unit tests; no writes).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pin the toolchain instead of trusting the image default so an image
      # rotation that drops this Xcode fails loudly here rather than silently
      # floating to a different compiler. macos-latest (macos-26 images)
      # ships only Xcode 26.x; 26.6 matches the local development toolchain.
      - name: Pin Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      # The macos-26 image pre-creates only current-generation simulator
      # devices (iPhone 17…), but the iPhone 16 device type still exists in
      # the SDK — create it so the acceptance command below runs verbatim.
      - name: Create iPhone 16 simulator
        run: xcrun simctl create 'iPhone 16' com.apple.CoreSimulator.SimDeviceType.iPhone-16

      - name: Build and run unit tests
        run: |
          set -o pipefail
          xcodebuild -project ios/Mobaide.xcodeproj -scheme Mobaide \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO test
