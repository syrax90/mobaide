name: iOS build

on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "tests/protocol_fixtures/**"
      - ".github/workflows/ios-build.yml"
  push:
    branches: [main]
    paths:
      - "ios/**"
      - "tests/protocol_fixtures/**"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

# Without an explicit permissions block, the workflow inherits the repo
# default, which can leave actions/checkout's GITHUB_TOKEN without the
# contents:read scope it needs to embed a usable Basic-auth header into
# the cloned remote's URL — surfacing as
#   fatal: could not read Username for 'https://github.com': terminal prompts disabled
# on the very first fetch. Declaring contents:read explicitly is the
# documented mitigation and is also the least-privilege envelope this job
# needs (it builds and runs unit tests; no writes).
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Pin the Xcode major, float the minor: macos-latest currently serves a
      # mixed pool (macos-15 images carry Xcode 26.0–26.3 alongside 16.x;
      # macos-26 images carry only 26.x), so an exact-version pin fails on
      # whichever snapshot lacks it. Selecting the newest installed 26.x works
      # on every pool image and still fails loudly if the major disappears.
      - name: Select newest Xcode 26
        run: |
          xcode="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26.x on this runner; installed: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
            exit 1
          fi
          echo "Selected $xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # A fresh runner's first simulator boot takes ~4 minutes (plus ~1.5 for
      # CoreSimulator to start), so prepare and boot the device in the
      # background while the build runs. macos-26 images pre-create only
      # current-generation devices (iPhone 17…) while the iPhone 16 device type
      # still exists in the SDK; macos-15 images already have the device, so
      # create it only when missing. The newest runtime's device is listed last.
      - name: Boot the iPhone 16 simulator in the background
        run: |
          cat > "$RUNNER_TEMP/prepare-sim.sh" <<'EOF'
          set -euo pipefail
          udid="$(xcrun simctl list devices available | sed -nE 's/^ +iPhone 16 \(([0-9A-F-]{36})\).*/\1/p' | tail -1)"
          if [ -z "$udid" ]; then
            udid="$(xcrun simctl create 'iPhone 16' com.apple.CoreSimulator.SimDeviceType.iPhone-16)"
          fi
          xcrun simctl bootstatus "$udid" -b
          echo "$udid" > "$RUNNER_TEMP/sim-udid"
          EOF
          nohup bash "$RUNNER_TEMP/prepare-sim.sh" > "$RUNNER_TEMP/prepare-sim.log" 2>&1 &

      # Resolving the SPM packages (Firebase binaries, GoogleSignIn, SwiftTerm;
      # ~1.2 GB) took 1.5-4 minutes over the network.
      - name: Cache Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/spm
          key: spm-${{ runner.os }}-${{ hashFiles('ios/Mobaide.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # -onlyUsePackageVersionsFromResolvedFile: SPM deps (GoogleSignIn-iOS)
      # resolve over the network on the runner; pin them to the committed
      # Package.resolved so version drift fails loudly instead of silently
      # floating. The generic destination needs no device, and ARCHS=arm64
      # keeps it from also building x86_64; the runner is Apple silicon.
      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project ios/Mobaide.xcodeproj -scheme Mobaide \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath ~/spm \
            -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 COMPILER_INDEX_STORE_ENABLE=NO CODE_SIGNING_ALLOWED=NO

      - name: Run unit tests
        run: |
          set -o pipefail
          # Wait for the background boot; stop early if the script died.
          for _ in $(seq 1 120); do
            [ -s "$RUNNER_TEMP/sim-udid" ] && break
            pgrep -f prepare-sim.sh >/dev/null || break
            sleep 5
          done
          if [ ! -s "$RUNNER_TEMP/sim-udid" ]; then
            echo "::error::The simulator did not boot"; cat "$RUNNER_TEMP/prepare-sim.log"; exit 1
          fi
          xcodebuild test-without-building -project ios/Mobaide.xcodeproj -scheme Mobaide \
            -destination "id=$(cat "$RUNNER_TEMP/sim-udid")" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -clonedSourcePackagesDirPath ~/spm \
            CODE_SIGNING_ALLOWED=NO
